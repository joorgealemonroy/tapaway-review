<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>TapAway - Share Who You Are</title>
    <meta name="description" content="TapAway makes it easy to share your links, contact info, and more with a single tap." />
    <meta name="author" content="TapAway" />
    
    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="https://xfrvckdcrqvkqdwjzopt.supabase.co" />
    <link rel="preconnect" href="https://xfrvckdcrqvkqdwjzopt.supabase.co" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Preload critical font -->
    <link rel="preload" as="font" type="font/woff2" href="https://fonts.gstatic.com/s/inter/v18/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7W0Q5nw.woff2" crossorigin />
    
    <!-- Load fonts with optimal strategy -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=League+Spartan:wght@700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=League+Spartan:wght@700&display=swap" rel="stylesheet"></noscript>

    <!-- Open Graph -->
    <meta property="og:title" content="TapAway - Share Who You Are" />
    <meta property="og:description" content="TapAway makes it easy to share your links, contact info, and more with a single tap." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tapaway.co" />
    <meta property="og:image" content="https://tapaway.co/logo-og.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@tapawayco" />
    <meta name="twitter:image" content="https://tapaway.co/logo-og.png" />
    
    <!-- Performance hints -->
    <meta name="theme-color" content="#ffffff" />
    
    <!-- Critical CSS for instant first paint -->
    <style>
      /* Minimal inline styles for instant render */
      :root { --background: 213 27% 97%; --foreground: 222 47% 11%; --primary: 182 85% 39%; }
      html, body { margin: 0; font-family: Inter, system-ui, -apple-system, sans-serif; background: var(--app-bg, hsl(var(--background))); min-height: 100%; }
      #root { min-height: 100vh; }
      /* Loading skeleton styles */
      .skeleton-pulse { animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; background: hsl(222.2 84% 4.9% / 0.1); }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Inline loading skeleton for instant first paint -->
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div style="width: 32px; height: 32px; border: 3px solid hsl(222.2 84% 4.9% / 0.2); border-top-color: hsl(222.2 47.4% 11.2%); border-radius: 50%; animation: spin 1s linear infinite;"></div>
      </div>
      <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
