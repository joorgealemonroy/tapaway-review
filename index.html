<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>TapAway | Custom NFC Cards & Business Hubs</title>
    <meta name="description" content="TapAway builds done-for-you NFC tap cards for local businesses. One tap opens your reviews, Instagram, menu & more. 14-day free trial." />
    <meta name="author" content="TapAway" />
    
    <!-- Discover the current page's main product image before the app bundle. -->
    <script>
      (() => {
        const personal = location.pathname === "/personal";
        if (location.pathname !== "/" && !personal) return;
        const prefix = personal ? "personal-networking-and-meme-cards" : "business-hub-preview";
        const widths = personal ? [1024] : [640, 1024, 1254];
        const preload = document.createElement("link");
        preload.rel = "preload";
        preload.as = "image";
        preload.href = `/product-photos/${prefix}-${1024}.webp`;
        preload.imageSrcset = widths.map(w => `/product-photos/${prefix}-${w}.webp ${w}w`).join(", ");
        preload.imageSizes = personal ? "(max-width: 650px) 250px, (max-width: 900px) 290px, 360px" : "(max-width: 650px) 100vw, 50vw";
        preload.fetchPriority = "high";
        document.head.appendChild(preload);
      })();
    </script>

    <!-- DNS prefetch for Supabase (used after hydration, not on critical path) -->
    <link rel="dns-prefetch" href="https://xfrvckdcrqvkqdwjzopt.supabase.co" />

    <!-- Preconnect to font origins (used immediately for FCP) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload critical Inter woff2 -->
    <link rel="preload" as="font" type="font/woff2" href="https://fonts.gstatic.com/s/inter/v18/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7W0Q5nw.woff2" crossorigin />

    <!-- Non-blocking font stylesheet load -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=League+Spartan:wght@700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=League+Spartan:wght@700&display=swap" rel="stylesheet"></noscript>

    <!-- Open Graph -->
    <meta property="og:title" content="TapAway | Custom NFC Cards & Business Hubs" />
    <meta property="og:description" content="Custom NFC and QR cards with your logo, menus, reviews, and business links. Done-for-you setup with a 14-day trial." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tapaway.co" />
    <meta property="og:image" content="https://tapaway.co/logo-og.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@tapawayco" />
    <meta name="twitter:image" content="https://tapaway.co/logo-og.png" />
    
    <!-- Performance hints -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Organization structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "TapAway",
        "url": "https://tapaway.co",
        "logo": "https://tapaway.co/apple-touch-icon.png",
        "telephone": "+1-909-285-6321",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "16393 E Foothill Blvd",
          "addressLocality": "Fontana",
          "addressRegion": "CA",
          "postalCode": "92335",
          "addressCountry": "US"
        },
        "founder": {
          "@type": "Person",
          "name": "Jorge Monroy"
        },
        "sameAs": [
          "https://www.instagram.com/tapawayco",
          "https://www.tiktok.com/@tapawayco",
          "https://twitter.com/tapawayco",
          "https://www.youtube.com/@tapawayco"
        ]
      }
    </script>

    <!-- Critical CSS for instant first paint -->
    <style>
      /* Minimal inline styles for instant render */
      :root { --background: 213 27% 97%; --foreground: 222 47% 11%; --primary: 182 85% 39%; }
      html, body { margin: 0; font-family: Inter, system-ui, -apple-system, sans-serif; background: var(--app-bg, #ffffff); min-height: 100%; }
      #root { min-height: 100vh; }
      /* Loading skeleton styles */
      .skeleton-pulse { animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; background: hsl(222.2 84% 4.9% / 0.1); }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Inline loading skeleton for instant first paint -->
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div style="width: 32px; height: 32px; border: 3px solid hsl(222.2 84% 4.9% / 0.2); border-top-color: hsl(222.2 47.4% 11.2%); border-radius: 50%; animation: spin 1s linear infinite;"></div>
      </div>
      <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
