name: Release security
on:
  pull_request:
  push:
    branches: [main, codex/storefront-conversion]
permissions:
  contents: read
concurrency:
  group: release-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run security:source
      - run: npm run security:test
      - name: Install isolated regression dependencies
        run: npm install --prefix "$RUNNER_TEMP/tapaway-qa" --no-save --ignore-scripts --package-lock=false @electric-sql/pglite@0.5.12 stripe@14.21.0 svix@1.76.1 @supabase/supabase-js@2.39.7
      - name: Verify payment, permission and abuse protections offline
        run: QA_MODULES="$RUNNER_TEMP/tapaway-qa/node_modules" npm run test:release
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build
      - name: Install isolated browser checks
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Verify rep editing and analytics in the production browser build
        run: |
          npm run preview -- --host 127.0.0.1 --port 8080 > "$RUNNER_TEMP/tapaway-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8080/ > /dev/null; then break; fi
            sleep 1
          done
          QA_BASE_URL=http://127.0.0.1:8080 python scripts/check-rep-analytics-browser.py
      - run: npm audit --omit=dev --audit-level=high
